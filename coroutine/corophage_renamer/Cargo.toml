[package]
name = "corophage_renamer"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "corophage_async_renamer"
path = "corophage_async_renamer.rs"

[[bin]]
name = "corophage_sync_renamer"
path = "corophage_sync_renamer.rs"

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
corophage = "0.5"
common = { path = "../common" }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.40.0", features = ["fs", "rt"] }

[lints]
workspace = true
